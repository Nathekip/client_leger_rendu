<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Met — accueil">
    <span class="brand-mark" aria-hidden="true">M</span>
    <span class="brand-name">The Met<span>Metropolitan Museum of Art</span></span>
  </a>
  <nav class="site-nav" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      La collection
    </a>
    <a routerLink="/" fragment="repartition">En chiffres</a>
    <a
      class="museum-nav-link"
      href="https://www.metmuseum.org/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Le musée <span aria-hidden="true">↗</span>
    </a>
  </nav>
</header>

<router-outlet />

<footer class="site-footer">
  <a class="footer-brand" routerLink="/">The Met / Open collection</a>
  <span>Explorez les œuvres, les récits et les cultures du monde.</span>
  <a href="https://metmuseum.github.io/" target="_blank" rel="noopener noreferrer">
    Données via l’API du Met ↗
  </a>
</footer>
